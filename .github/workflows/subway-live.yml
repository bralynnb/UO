name: Subway public URL verification
on:
  push:
    branches: [tsfm-subway-scummvm]
    paths: ['.github/workflows/subway-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Wait for the tested public release
        run: |
          python - <<'PY'
          import urllib.request,time
          base='https://tsfm-night-train-production.up.railway.app'
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(base+'/health',timeout=12) as r:
                      assert r.status==200
                  with urllib.request.urlopen(base+'/run.html',timeout=12) as r:
                      assert 'function fitCanvas()' in r.read().decode()
                  print('Public deployment is ready');break
              except Exception as e:
                  print(type(e).__name__,str(e));time.sleep(5)
          else: raise SystemExit('Public deployment did not become ready')
          PY
      - name: Exercise all three cars and native rebuild on public URL
        env:
          TEST_URL: https://tsfm-night-train-production.up.railway.app
        run: |
          cd subway
          python tests/browser_test.py
      - name: Keep live verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subway-public-url-results
          path: subway/test-results
          retention-days: 7
