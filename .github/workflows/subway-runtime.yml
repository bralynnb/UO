name: Subway browser verification
on:
  push:
    branches: [tsfm-subway-scummvm]
    paths: ['subway/**', '.github/workflows/subway-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: subway-browser
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install compiler and browser dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bison flex build-essential libpng-dev
          python -m pip install Pillow==11.3.0 playwright
          python -m playwright install --with-deps chromium
      - name: Build real SCUMM game and fetch matching runtime
        run: sh subway/tools/bootstrap.sh
      - name: Verify browser inputs and editor compilation
        env:
          SCUMMC_ROOT: ${{ github.workspace }}/subway/.toolchain/scummc
        run: |
          cd subway
          python serve.py > server.log 2>&1 &
          sleep 2
          python tests/browser_test.py
      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subway-browser-results
          path: |
            subway/test-results
            subway/server.log
          retention-days: 7
      - name: Package game and source
        if: success()
        run: |
          cd subway
          rm -rf web/builds/* .toolchain
          zip -qr ../tsfm-subway-browser.zip . -x 'test-results/*' 'server.log'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tsfm-subway-browser
          path: tsfm-subway-browser.zip
          retention-days: 7
