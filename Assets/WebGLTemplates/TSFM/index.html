<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142623"><title>The Strangest Flea Market — Play</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#142623;color:#e0e7d6;font-family:Arial,sans-serif;overflow:hidden}canvas{width:100%;height:100%;display:block;outline:none}#loading{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,#304b43,#142623 70%)}.ticket{width:min(90vw,560px);padding:44px;border:1px solid #607d6f}small{font-size:12px;letter-spacing:.22em;color:#a9cbb1}h1{font:normal clamp(38px,6vw,66px)/1.03 Georgia,serif;margin:28px 0}p{color:#a8b9ad;line-height:1.6}progress{width:100%;height:5px;accent-color:#a9cbb1}#error{display:none;color:#ecb0a4}button{padding:12px 22px;border:0;background:#a9cbb1;color:#142623;cursor:pointer}#fullscreen{position:fixed;right:14px;bottom:8px;opacity:.55;background:transparent;color:#e0e7d6;font-size:11px;padding:4px}
</style></head>
<body><canvas id="unity-canvas" tabindex="0" aria-label="The Strangest Flea Market multiplayer game"></canvas><div id="loading"><div class="ticket"><small>NEW YORK · MARKET BLOCK 01</small><h1>The Strangest<br>Flea Market</h1><p id="status">Opening the street. Please wait.</p><progress id="progress" value="0" max="1"></progress><p id="error"></p><p>Walk in. Find work. Meet your neighbors.<br>No account required.</p></div></div><button id="fullscreen" aria-label="Enter fullscreen">FULLSCREEN ↗</button>
<script>
const canvas=document.getElementById('unity-canvas');
function fail(message){document.getElementById('status').textContent='The market could not load.';const e=document.getElementById('error');e.style.display='block';e.textContent=message+' Reload this page to try again.';}
const buildUrl='Build';
const script=document.createElement('script');script.src=buildUrl+'/{{{ LOADER_FILENAME }}}';script.onerror=()=>fail('The Unity build files could not be downloaded.');
script.onload=()=>createUnityInstance(canvas,{
 dataUrl:buildUrl+'/{{{ DATA_FILENAME }}}',frameworkUrl:buildUrl+'/{{{ FRAMEWORK_FILENAME }}}',codeUrl:buildUrl+'/{{{ CODE_FILENAME }}}',
 streamingAssetsUrl:'StreamingAssets',companyName:'TSFM',productName:'The Strangest Flea Market',productVersion:'0.1.0',
 devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5)
},p=>{document.getElementById('progress').value=p;document.getElementById('status').textContent='Opening the street… '+Math.round(p*100)+'%';}).then(instance=>{
 document.getElementById('loading').style.display='none';canvas.focus();document.getElementById('fullscreen').onclick=()=>instance.SetFullscreen(1);
}).catch(error=>fail(String(error)));
document.body.appendChild(script);
</script></body></html>
