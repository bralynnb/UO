services:
  market:
    build: .
    restart: unless-stopped
    environment:
      PORT: '8080'
      DATABASE_PATH: /app/data/market.sqlite
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN to your game hostname}
      MAX_PLAYERS: '64'
    volumes:
      - market_data:/app/data
    expose:
      - '8080'
  https:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your game hostname}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      market:
        condition: service_healthy
volumes:
  market_data:
  caddy_data:
  caddy_config:
