<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Pale Moonlight · Chapter 1</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23b99a6d'/%3E%3Ccircle cx='22' cy='12' r='12' fill='%23050811'/%3E%3C/svg%3E"><style>html,body{margin:0;background:#050811;color:#c5afd1;font:14px monospace;width:100%;height:100%;overflow:hidden}canvas{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;outline:none;cursor:none}#loading{position:absolute;inset:0;background:#080b16;display:grid;place-content:center;text-align:center;z-index:2;padding:30px}#loading[hidden]{display:none}button{font:inherit;background:#211a35;color:#e0c9ed;border:2px solid #a36bc0;padding:12px;margin:16px;cursor:pointer}#status{max-width:600px}progress{width:260px;max-width:70vw}#download-modal{display:none!important}</style>
<canvas id="canvas" width="640" height="400" tabindex="0" aria-label="Pale Moonlight adventure"></canvas><div id="loading"><h1>PALE MOONLIGHT</h1><p>CHAPTER 1 · THE COST OF CERTAINTY</p><p id="status">Play as Sisko. Click to walk. Choose a verb, then an object. F5: save. F7: load.</p><progress hidden id="progress"></progress><button id="start">PLAY CHAPTER 1</button><button id="retry" hidden>RETRY</button><p>Original fan-game prototype · 1 of 10 chapters playable</p></div><div id="download-modal"><div id="download-modal-title"><h3></h3></div><div id="download-modal-progress-fill"></div><p id="download-modal-progress-text"></p><p id="download-modal-speed-text"></p></div>
<script>
'use strict';
const canvas=document.getElementById('canvas'),statusEl=document.getElementById('status'),startEl=document.getElementById('start'),progressEl=document.getElementById('progress');
// SDL may resize its drawing buffer during startup. Fit that actual buffer, not a guessed CSS ratio.
function fitCanvas(){const s=Math.min(innerWidth/canvas.width,innerHeight/canvas.height);for(const[k,v]of [['width',Math.floor(canvas.width*s)+'px'],['height',Math.floor(canvas.height*s)+'px']])if(canvas.style[k]!==v)canvas.style.setProperty(k,v,'important');}
new MutationObserver(fitCanvas).observe(canvas,{attributes:true,attributeFilter:['width','height','style']});addEventListener('resize',fitCanvas);fitCanvas();
window.gameEvents=[];window.gameErrors=[];let ready=false,timeout;
function report(line){const text=String(line);console.log(text);gameEvents.push(text);if(gameEvents.length>1000)gameEvents.shift();if(text.includes('PALE_READY')){ready=true;clearTimeout(timeout);document.getElementById('loading').hidden=true;fitCanvas();canvas.focus({preventScroll:true});parent.postMessage({type:'pale-ready',line:text},location.origin);}}
function failed(e){const msg=String(e);gameErrors.push(msg);console.error(msg);document.getElementById('loading').hidden=false;statusEl.textContent='The game could not start: '+msg;document.getElementById('retry').hidden=false;progressEl.hidden=true;clearTimeout(timeout);}
document.getElementById('retry').onclick=()=>location.reload();canvas.addEventListener('contextmenu',e=>e.preventDefault());
async function checked(path){const r=await fetch(path);if(!r.ok)throw Error(path+' — HTTP '+r.status);return new Uint8Array(await r.arrayBuffer());}
async function boot(){startEl.hidden=true;progressEl.hidden=false;statusEl.textContent='Loading ScummVM and Chapter 1…';try{
 const files=await Promise.all([['/game/chapter1.slg','game/chapter1.slg'],['/plugins/libsludge.so','plugins/libsludge.so']].map(async([p,u])=>[p,await checked(u)]));
 const parts=await Promise.all([checked('scummvm.wasm.0'),checked('scummvm.wasm.1')]);const wasmBinary=new Uint8Array(parts[0].length+parts[1].length);wasmBinary.set(parts[0]);wasmBinary.set(parts[1],parts[0].length);
 window.Module={canvas,wasmBinary,arguments:['--config=/boot.ini','--path=/game','--savepath=/saves','--music-driver=null','--gfx-mode=normal','--no-filtering','--no-aspect-ratio','--debuglevel=3','pale'],print:report,printErr:report,setStatus:line=>{if(line&&!ready)statusEl.textContent=line;if(line===''){ready=true;clearTimeout(timeout);document.getElementById('loading').hidden=true;fitCanvas();canvas.focus();}},onAbort:failed,
 preRun:[()=>{for(const p of ['/game','/plugins','/saves'])if(!FS.analyzePath(p).exists)FS.mkdir(p);for(const[p,b]of files)FS.writeFile(p,b);
 FS.writeFile('/boot.ini','[scummvm]\npluginspath=/plugins\ngui_theme=builtin\nsubtitles=true\nspeech_mute=true\nshow_splash=false\nstretch_mode=fit\n\n[engine_plugin_files]\nsludge=/plugins/libsludge.so\n\n[pale]\nengineid=sludge\ngameid=sludge\npath=/game\ndescription=Pale Moonlight\nplatform=pc\nlanguage=en\n');
 addRunDependency('pale-saves');try{FS.mount(IDBFS,{autoPersist:true},'/saves');FS.syncfs(true,e=>{if(e)report('Persistent saves unavailable: '+e);removeRunDependency('pale-saves');});}catch(e){report('Persistent saves unavailable: '+e);removeRunDependency('pale-saves');}}]};
 history.replaceState(null,'',location.pathname+location.search+'#'+encodeURI(Module.arguments.join(' ')));
 const js=document.createElement('script');js.src='scummvm.js';js.onerror=()=>failed('Engine script download failed.');document.body.appendChild(js);timeout=setTimeout(()=>{if(!ready)failed('Engine startup timed out. Retry or open in a full desktop browser.');},90000);
}catch(e){failed(e.message);}}
startEl.onclick=boot;window.addEventListener('error',e=>failed(e.message));
</script></html>
