<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>TSFM · Night Train</title>
<style>html,body{margin:0;background:#050811;color:#c5afd1;font:14px monospace;width:100%;height:100%;overflow:hidden}canvas{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;outline:none;cursor:none}#loading{position:absolute;inset:0;background:#080b16;display:grid;place-content:center;text-align:center;z-index:2;padding:30px}#loading[hidden]{display:none}button{font:inherit;background:#211a35;color:#e0c9ed;border:2px solid #a36bc0;padding:12px;margin:16px;cursor:pointer}#status{max-width:600px}progress{width:260px;max-width:70vw}#download-modal{display:none!important}</style>
<canvas id="canvas" width="640" height="400" tabindex="0" aria-label="Subway adventure"></canvas><div id="loading"><h1>NIGHT TRAIN</h1><p>THE STRANGEST FLEA MARKET</p><p id="status">A quiet ride through New York, 1985.</p><progress hidden id="progress"></progress><button id="start">BOARD THE TRAIN</button><button id="retry" hidden>RETRY</button></div><div id="download-modal"><div id="download-modal-title"><h3></h3></div><div id="download-modal-progress-fill"></div><p id="download-modal-progress-text"></p><p id="download-modal-speed-text"></p></div>
<script>
'use strict';
const canvas=document.getElementById('canvas'),statusEl=document.getElementById('status'),startEl=document.getElementById('start'),progressEl=document.getElementById('progress');
// SDL may resize its drawing buffer during startup. Fit that actual buffer, not a guessed CSS ratio.
function fitCanvas(){const s=Math.min(innerWidth/canvas.width,innerHeight/canvas.height);for(const[k,v]of [['width',Math.floor(canvas.width*s)+'px'],['height',Math.floor(canvas.height*s)+'px']])if(canvas.style[k]!==v)canvas.style.setProperty(k,v,'important');}
new MutationObserver(fitCanvas).observe(canvas,{attributes:true,attributeFilter:['width','height','style']});addEventListener('resize',fitCanvas);fitCanvas();
window.gameEvents=[];window.gameErrors=[];let ready=false,timeout;
function report(line){const text=String(line);console.log(text);gameEvents.push(text);if(gameEvents.length>1000)gameEvents.shift();if(text.includes('TSFM_CAR=')){ready=true;clearTimeout(timeout);document.getElementById('loading').hidden=true;fitCanvas();canvas.focus({preventScroll:true});parent.postMessage({type:'tsfm-ready',line:text},location.origin);}}
function failed(e){const msg=String(e);gameErrors.push(msg);console.error(msg);document.getElementById('loading').hidden=false;statusEl.textContent='The ride could not start: '+msg;document.getElementById('retry').hidden=false;progressEl.hidden=true;clearTimeout(timeout);}
document.getElementById('retry').onclick=()=>location.reload();canvas.addEventListener('contextmenu',e=>e.preventDefault());
async function checked(path){const r=await fetch(path);if(!r.ok)throw Error(path+' — HTTP '+r.status);return new Uint8Array(await r.arrayBuffer());}
async function boot(){startEl.hidden=true;progressEl.hidden=false;statusEl.textContent='Loading the ScummVM engine and train…';try{
 const id=new URLSearchParams(location.search).get('build');if(id&&!/^[a-f0-9]{32}$/.test(id))throw Error('Invalid build identifier');const base=id?'/builds/'+id+'/game/':'game/';
 const files=await Promise.all([['/game/tentacle.000',base+'tentacle.000'],['/game/tentacle.001',base+'tentacle.001'],['/plugins/libscumm.so','plugins/libscumm.so']].map(async([p,u])=>[p,await checked(u)]));
 window.Module={canvas,arguments:['--config=/boot.ini','--path=/game','--savepath=/saves','--music-driver=null','--gfx-mode=normal','--no-filtering','--no-aspect-ratio','--debuglevel=3','tsfm'],print:report,printErr:report,setStatus:line=>{if(line&&!ready)statusEl.textContent=line;},onAbort:failed,
 preRun:[()=>{for(const p of ['/game','/plugins','/saves'])if(!FS.analyzePath(p).exists)FS.mkdir(p);for(const[p,b]of files)FS.writeFile(p,b);
 FS.writeFile('/boot.ini','[scummvm]\npluginspath=/plugins\ngui_theme=builtin\nsubtitles=true\nspeech_mute=true\nshow_splash=false\nstretch_mode=fit\n\n[engine_plugin_files]\nscumm=/plugins/libscumm.so\n\n[tsfm]\nengineid=scumm\ngameid=tentacle\npath=/game\ndescription=TSFM - Night Train\nplatform=pc\nlanguage=en\n');
 addRunDependency('tsfm-saves');try{FS.mount(IDBFS,{autoPersist:true},'/saves');FS.syncfs(true,e=>{if(e)report('Persistent saves unavailable: '+e);removeRunDependency('tsfm-saves');});}catch(e){report('Persistent saves unavailable: '+e);removeRunDependency('tsfm-saves');}}]};
 history.replaceState(null,'',location.pathname+location.search+'#'+encodeURI(Module.arguments.join(' ')));
 const js=document.createElement('script');js.src='scummvm.js';js.onerror=()=>failed('Engine script download failed.');document.body.appendChild(js);timeout=setTimeout(()=>{if(!ready)failed('Engine startup timed out. Retry or open in a full desktop browser.');},90000);
}catch(e){failed(e.message);}}
startEl.onclick=boot;window.addEventListener('error',e=>failed(e.message));
</script></html>
